function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}
function sampleUnique(a,n,exclude=[]){
  const blocked=new Set(exclude);
  const pool=a.filter(x=>!blocked.has(x));
  return shuffle(pool).slice(0,n);
}

function bonusDifferent(baseRole, oddRole){
  const baseItems=sampleUnique(R[baseRole],3);
  const oddItem=sampleUnique(R[oddRole],1)[0];
  let a=[...baseItems.map(t=>({r:baseRole,t})),{r:oddRole,t:oddItem}];
  a=shuffle(a);
  return{
    type:"mc",
    instruction:"BONUS · 다음 중 밑줄 친 to부정사의 쓰임이 나머지와 다른 하나는?",
    htmlOptions:a.map(x=>x.t),
    answer:a.findIndex(x=>x.r===oddRole),
    hint:"세 문장은 같은 역할이고 한 문장만 다른 역할입니다. to부정사의 위치와 앞에 오는 동사를 비교하세요.",
    explanation:`한 문장만 ${oddRole==="subject"?"주어":oddRole==="object"?"목적어":"보어"}로 쓰였습니다.`
  };
}
function bonusSame(role){
  const other=role==="subject"?["object","complement"]:
              role==="object"?["subject","complement"]:
              ["subject","object"];
  const view=pick(R[role]);
  const correct=sampleUnique(R[role],1,[view])[0];
  const d1=sampleUnique(R[other[0]],2);
  const d2=sampleUnique(R[other[1]],1)[0];
  let a=[
    {r:role,t:correct},
    {r:other[0],t:d1[0]},
    {r:other[0],t:d1[1]},
    {r:other[1],t:d2}
  ];
  a=shuffle(a);
  return{
    type:"mc",
    instruction:"BONUS · 다음 중 밑줄 친 to부정사의 쓰임이 <보기>와 같은 것은?",
    htmlStem:`<b>&lt;보기&gt;</b><br>${view}`,
    htmlOptions:a.map(x=>x.t),
    answer:a.findIndex(x=>x.r===role),
    hint:"<보기>에서 to부정사가 문장 맨 앞인지, 일반동사 뒤인지, be동사 뒤인지 먼저 확인하세요.",
    explanation:"<보기>와 같은 문장 성분으로 쓰인 문장을 찾으면 됩니다."
  };
}
function bonusSequence(){
 return{
  type:"mc",
  instruction:"BONUS · 세 문장의 밑줄 친 to부정사의 쓰임을 순서대로 바르게 나타낸 것은?",
  htmlStem:`(A) ${pick(R.complement)}<br>(B) ${pick(R.subject)}<br>(C) ${pick(R.object)}`,
  options:["주어 - 목적어 - 보어","보어 - 주어 - 목적어","보어 - 목적어 - 주어","목적어 - 주어 - 보어"],
  answer:1,
  hint:"(A)는 be동사 뒤, (B)는 문장 맨 앞, (C)는 일반동사 뒤에 있습니다.",
  explanation:"순서는 보어 - 주어 - 목적어입니다."
 };
}
function bonusCount(){
  const s=sampleUnique(R.subject,2);
  const o=sampleUnique(R.object,1)[0];
  const c=sampleUnique(R.complement,1)[0];
  return{
    type:"mc",
    instruction:"BONUS · 다음 중 밑줄 친 to부정사가 주어로 쓰인 문장의 개수는?",
    htmlStem:`ⓐ ${s[0]}<br>ⓑ ${o}<br>ⓒ ${s[1]}<br>ⓓ ${c}`,
    options:["1개","2개","3개","4개"],
    answer:1,
    hint:"문장 맨 앞에서 뒤의 동사를 이끄는 to부정사구를 찾으세요.",
    explanation:"주어로 쓰인 문장은 2개입니다."
  };
}
function bonusPair(){
  const s=sampleUnique(R.subject,2);
  const o=sampleUnique(R.object,3);
  const c=sampleUnique(R.complement,3);
  return{
    type:"mc",
    instruction:"BONUS · 두 문장의 밑줄 친 to부정사의 쓰임이 서로 다른 것은?",
    htmlOptions:[
      `${s[0]} / ${s[1]}`,
      `${o[0]} / ${o[1]}`,
      `${c[0]} / ${c[1]}`,
      `${o[2]} / ${c[2]}`
    ],
    answer:3,
    hint:"앞 세 쌍은 같은 역할끼리 묶여 있습니다. 서로 다른 역할의 쌍을 찾으세요.",
    explanation:"④는 목적어와 보어가 한 쌍으로 묶여 있어 서로 쓰임이 다릅니다."
  };
}
function writingBonus(kind){
 const bank={
  subject:[
   {k:"일찍 자는 것은 건강에 좋다.",w:"go to bed early / good for your health",a:["To go to bed early is good for your health"]},
   {k:"영어를 매일 연습하는 것은 중요하다.",w:"practice English every day / important",a:["To practice English every day is important"]}
  ],
  object:[
   {k:"나는 오늘 숙제를 끝내고 싶다.",w:"want / finish my homework / today",a:["I want to finish my homework today"]},
   {k:"우리는 그 영화를 보고 싶다.",w:"want / see the movie",a:["We want to see the movie"]}
  ],
  complement:[
   {k:"나의 목표는 매일 책을 읽는 것이다.",w:"my goal / read books / every day",a:["My goal is to read books every day"]},
   {k:"그녀의 꿈은 의사가 되는 것이다.",w:"her dream / be / a doctor",a:["Her dream is to be a doctor"]}
  ]
 };
 const x=pick(bank[kind]);
 return{type:"text",instruction:"BONUS · 우리말과 주어진 말을 참고하여 영작하세요.",korean:x.k,words:x.w,accepted:x.a,hint:"to + 동사원형을 하나의 명사 덩어리처럼 사용하세요.",explanation:`가능한 정답: ${x.a[0]}.`};
}
function singularBonus(){
 const x=pick([
  {s:"To read many books in English",c:"useful"},
  {s:"To play board games with my classmates",c:"fun"},
  {s:"To visit famous museums with my parents",c:"exciting"},
  {s:"To help younger students with their homework",c:"important"}
 ]);
 return{
  type:"mc",
  instruction:"BONUS · 빈칸에 알맞은 be동사를 고르세요.",
  htmlStem:`<span class="underline">${x.s}</span> ______ ${x.c}.`,
  options:["is","are"],
  answer:0,
  hint:"밑줄 안에 복수명사가 있더라도, 문장 전체의 주어가 무엇인지 확인하세요. to부정사구 전체는 하나의 행동을 나타냅니다.",
  explanation:`${x.s} 전체가 하나의 to부정사구 주어이므로 단수 취급하여 is를 사용합니다.`
 };
}
function makeBonus(q){
 if(q.id==="1")return bonusDifferent("object","subject");
 if(q.id==="2")return bonusSame("complement");
 if(q.id==="3")return bonusSame("subject");
 if(q.id==="4")return bonusSequence();
 if(q.id==="5")return bonusPair();
 if(q.id==="6")return bonusCount();
 if(q.id==="7")return bonusDifferent("complement","object");
 if(q.id==="8")return bonusPair();
 if(q.id==="9")return bonusSequence();
 if(["10","13"].includes(q.id))return writingBonus("subject");
 if(["11","14"].includes(q.id))return writingBonus("object");
 if(["12","15"].includes(q.id))return writingBonus("complement");
 return singularBonus();
}

function esc(x){
  return String(x??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}
function norm(x){
  return String(x??"")
    .toLowerCase()
    .replace(/[’‘`]/g,"'")
    .replace(/[.,!?]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

  save();

function mainHint(q){
  const n=S.attempts[S.idx];
  const h=q.hints[Math.min(n-1,q.hints.length-1)];
  const label=n===1?"💡 힌트":n===2?"🔎 한 번 더 생각해 봅시다":"📘 핵심 단서";
  return `${label}\n${h}\n\n다시 풀어 보세요.`;
}

function submitMainChoice(k){
  if(S.mode!=="question") return;

  const q=current();
  S.attempts[S.idx]++;

  const list=q.options || q.htmlOptions || [];
  add("student",`${marks[k]} ${q.options?list[k]:"선택한 문장"}`);

  if(k===q.answer){
    add("tutor",`정답입니다! 🎉\n${q.explanation}`,"good");

    if(S.attempts[S.idx]>1){
      S.bonus=makeBonus(q);
      S.bonusAttempts=0;
      S.mode="bonus";
      add("tutor","한 번 틀렸던 문제이므로 같은 유형의 BONUS PRACTICE를 한 문제 더 풀어 볼게요.");
      renderBonus();
    }else{
      S.mode="questionDone";
      save();
      renderQuestionDone();
    }
  }else{
    add("tutor",mainHint(q),"warn");
    renderQuestion();
  }
}

function submitMainText(v){
  if(S.mode!=="question" || !v.trim()) return;

  const q=current();
  S.attempts[S.idx]++;
  add("student",v);

  const ok=q.accepted.some(a=>norm(a)===norm(v));

  if(ok){
    add("tutor",`정답입니다! 🎉\n${q.explanation}`,"good");

    if(S.attempts[S.idx]>1){
      S.bonus=makeBonus(q);
      S.bonusAttempts=0;
      S.mode="bonus";
      add("tutor","한 번 틀렸던 문제이므로 같은 유형의 BONUS PRACTICE를 한 문제 더 풀어 볼게요.");
      renderBonus();
    }else{
      S.mode="questionDone";
      save();
      renderQuestionDone();
    }
  }else{
    add("tutor",mainHint(q),"warn");
    renderQuestion();
  }
}

  btn.addEventListener("click",()=>{
    btn.disabled=true;

    if(S.mode!=="bonusDone" || S.idx!==indexAtRender) return;

    S.bonus=null;
    S.bonusAttempts=0;

    if(last){
      finishStudy();
    }else{
      S.idx=indexAtRender+1;
      S.mode="question";
      add("tutor",`좋아요. 문제 ${Q[S.idx].id}로 넘어갑니다.`);
      renderQuestion();
    }
  },{once:true});
}

function confetti(){
  const c=["#f35b66","#ffd44d","#55b981","#6d8cff","#ff8f4e","#70c7d4"];
  let s="";
  for(let i=0;i<20;i++){
    s+=`<span class="confetti" style="left:${(i*47+8)%100}%;top:-40px;background:${c[i%c.length]};animation-delay:${(i%7)*.38}s;animation-duration:${4.3+(i%5)*.45}s"></span>`;
  }
  return s;
}

function timeText(){
  const d=S.finishedAt?new Date(S.finishedAt):new Date();
  return new Intl.DateTimeFormat("ko-KR",{
    year:"numeric",month:"long",day:"numeric",hour:"numeric",minute:"2-digit"
  }).format(d);
}

function finishStudy(){
  S.mode="done";
  S.finishedAt=new Date().toISOString();
  save();
  renderDone();
}

function renderDone(){
  const displayName=S.name||"학생";
  const displayGroup=S.group||"미입력";

  app.innerHTML=`<section class="complete">
    ${confetti()}
    <div class="trophy">🎉🏆🎉</div>
    <h2>16문제 완료!</h2>
    <p><b>${esc(displayName)}</b>, to부정사의 명사적 용법 학습을 모두 마쳤습니다.<br>
    to부정사의 쓰임 비교, 주어의 단수 취급, 영작까지 끝까지 해결했어요.</p>

    <div class="completeCard">
      <div style="font-weight:950;font-size:21px;color:#214f79">✅ 학습 완료</div>
      <div class="identity" style="grid-template-columns:1fr 1fr">
        <div class="idbox">
          <div class="sm">이름 또는 별명</div>
          <div class="big">${esc(S.name||"미입력")}</div>
        </div>
        <div class="idbox">
          <div class="sm">반 / 번호</div>
          <div class="big">${esc(displayGroup)}</div>
        </div>
      </div>
      <div style="font-size:13px;color:#667f96">완료 시각: ${esc(timeText())}</div>
    </div>

    <button id="again" class="btn secondary">처음부터 다시 풀기</button>
  </section>`;

  document.getElementById("again").addEventListener("click",hardReset,{once:true});
  window.scrollTo({top:0,behavior:"smooth"});
}

function hardReset(){
  clearOldStorage();
  S=freshState();
  renderIntro();
  window.scrollTo({top:0,behavior:"smooth"});
}

// 확인창 없이 언제든 즉시 첫 화면으로 돌아감
reset.addEventListener("click",hardReset);

renderIntro();
</script></body></html>
